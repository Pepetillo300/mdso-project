apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-cicd-demo
  namespace: demo
  labels:
    app.kubernetes.io/name: gke-cicd-demo
    app.kubernetes.io/part-of: gke-cicd-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # maxUnavailable: 0 keeps at least 2 ready pods during a rollout, which is
  # what allows the "no downtime on deploy" claim to be tested with a load
  # generator instead of just asserted.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-cicd-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-cicd-demo
        app.kubernetes.io/part-of: gke-cicd-demo
    spec:
      # The app finishes in-flight requests itself (fails /readyz, waits 5s,
      # then closes). The image is distroless, so a preStop `exec: sleep` is
      # impossible: there is no shell. This grace period is the safety net.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones so a single-zone incident cannot take the
      # whole service down. ScheduleAnyway keeps this a preference, not a hard
      # constraint, so a zonal lab cluster still schedules fine.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gke-cicd-demo
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gke-cicd-demo
      containers:
        - name: web
          # Replaced by Cloud Build with an immutable digest reference.
          # Never :latest - see README for the reasoning.
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: production
            - name: PORT
              value: "8080"
          resources:
            requests:
              # 50m, not 100m. With 2 e2-medium nodes, GKE's own system pods
              # already request ~90% of allocatable CPU. maxUnavailable: 0
              # requires room for one extra pod during a rollout, and at 100m
              # that surge pod cannot be scheduled: the rollout deadlocks.
              # This app idles at 1-2m; 50m is still generous headroom.
              cpu: 50m
              memory: 128Mi
            limits:
              # No CPU limit on purpose: CPU throttling on a request-serving
              # workload hurts tail latency. Memory is limited because memory
              # is not compressible.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Startup probe first: it gives a slow cold start room to breathe
          # without forcing a permissive failureThreshold on the liveness probe.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
